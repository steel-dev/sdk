[package]
name = "steel-rs"
version = "0.22.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "The official Rust library for the Steel API"
repository = "https://github.com/steel-dev/sdk"
documentation = "https://docs.rs/steel-rs"
readme = "README.md"

[dependencies]
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
