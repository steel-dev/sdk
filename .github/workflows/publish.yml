name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a release"
            exit 0
          fi
          version=${TAG#v}
          awk -v heading="## $version " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > notes.md
          flags=(--title "$TAG" --notes-file notes.md --verify-tag)
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}"

  npm:
    name: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install an npm whose trusted publishing covers dist-tags
        run: npm install --global "npm@^11.21.0"

      - name: Build
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: Publish unless npm has this version
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "steel-sdk@$version" version > /dev/null 2>&1; then
            echo "steel-sdk@$version is already on npm"
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=preview ;; esac
          cd dist
          npm publish --access public --tag "$tag"

      - name: Point the preview tag at a release that passes it
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in *-*) exit 0 ;; esac
          preview=$(npm view steel-sdk dist-tags.preview)
          if [ "$(printf '%s\n' "${preview%%-*}" "$version" | sort -V | tail -1)" = "$version" ]; then
            npm dist-tag add "steel-sdk@$version" preview
          fi

  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: python
        run: |
          python -m pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

  crates:
    name: crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Check whether crates.io has this version
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl --silent --fail --user-agent "steel-sdk-publish" "https://crates.io/api/v1/crates/steel-rs/$version" > /dev/null; then
            echo "steel-rs $version is already on crates.io"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.exists == 'false'
        id: auth

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  maven:
    name: Maven Central (${{ matrix.sdk }})
    if: vars.MAVEN_CENTRAL == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [java, kotlin]
    env:
      ARTIFACT: steel-${{ matrix.sdk }}
    defaults:
      run:
        working-directory: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check whether Maven Central has this version
        id: check
        run: |
          version=$(sed -n 's/^    version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl --silent --fail --head "https://repo1.maven.org/maven2/dev/steel/$ARTIFACT/$version/$ARTIFACT-$version.pom" > /dev/null; then
            echo "dev.steel:$ARTIFACT:$version is already on Maven Central"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and sign
        if: steps.check.outputs.exists == 'false'
        env:
          GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew publish -PpublishLocal

      - name: Upload to the Central Portal
        if: steps.check.outputs.exists == 'false'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          (cd build/local-maven-repo && zip -qr ../central-bundle.zip dev)
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $token" \
            --form "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=$ARTIFACT-$VERSION"
